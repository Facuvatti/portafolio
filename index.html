    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      // Corre antes del primer pintado para que la página no asome antes del encendido.
      ;(function () {
        try {
          var inicio = location.pathname === '%BASE_URL%' || location.pathname === '%BASE_URL%index.html'
          var pedido = new URLSearchParams(location.search).has('intro')
          var calma = matchMedia('(prefers-reduced-motion: reduce)').matches
          if (inicio && (pedido || (!calma && !sessionStorage.getItem('encendido')))) {
            document.documentElement.setAttribute('data-intro', '')
          }
        } catch (e) {}
      })()
    </script>
